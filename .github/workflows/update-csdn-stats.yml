name: Update CSDN Stats

on:
  schedule:
    - cron: "30 1 * * *" # 每天 UTC 01:30 (北京 09:30)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch CSDN stats & update README
        run: python scripts/update_csdn_stats.py

      - name: Commit & push if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update CSDN stats"
          git pull --rebase
          git push
